services:
  caddy:
    container_name: caddy
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    env_file:
      - ./runtime/vps01/secrets/caddy.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./config/caddy/data:/data
      - ./config/caddy/config:/config
    networks:
      - proxy

  postgres:
    container_name: postgres
    image: postgres:17-trixie
    restart: unless-stopped
    env_file:
      - ./runtime/vps01/secrets/postgres.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./config/postgres/data:/var/lib/postgresql/data
    networks:
      - backend

  n8n:
    container_name: n8n
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./runtime/vps01/secrets/n8n.env
    environment:
      N8N_HOST: ops.wormlogic.com
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://ops.wormlogic.com
      WEBHOOK_URL: https://ops.wormlogic.com
      GENERIC_TIMEZONE: America/New_York
      TZ: America/New_York
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes:
      - ./config/n8n/data:/home/node/.n8n
    networks:
      - backend
      - proxy

  beszel:
    container_name: beszel
    image: henrygd/beszel:latest
    restart: unless-stopped
    volumes:
      - ./config/beszel/data:/beszel_data
    networks:
      - proxy

  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    restart: unless-stopped
    environment:
      TZ: America/New_York
      FTLCONF_dns_listeningMode: "ALL"
      FTLCONF_dns_upstreams: "172.21.0.1#5335"
      WEBPASSWORD_FILE: pihole_web_password
    secrets:
      - pihole_web_password
    volumes:
      - ./config/pihole:/etc/pihole
    ports:
      # Bootstrap/testing only. Nothing exposed on Heighliner's public address.
      - "127.0.0.1:1053:53/tcp"
      - "127.0.0.1:1053:53/udp"
      - "127.0.0.1:8081:80/tcp"
      # PVP WireGuard clients
      - "10.9.0.1:53:53/tcp"
      - "10.9.0.1:53:53/udp"
      - "10.9.0.1:8081:80/tcp"
    networks:
      dns:
        ipv4_address: 172.21.0.2

  homepage-docker-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: homepage-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
      ALLOW_ARCHIVE: 0
      ALLOW_CHANGES: 0
      ALLOW_EXPORT: 0
      ALLOW_LOGS: 0
      ALLOW_TOP: 0
      ALLOW_START: 0
      ALLOW_STOP: 0
      ALLOW_RESTARTS: 0
      ALLOW_PAUSE: 0
      ALLOW_UNPAUSE: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "10.8.0.1:2375:2375"
    network_mode: bridge
    read_only: true
    tmpfs:
      - /run

secrets:
  pihole_web_password:
    file: ./runtime/vps01/secrets/pihole_web_password.txt

networks:
  backend:
  proxy:
  dns:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-pihole
    ipam:
      config:
        - subnet: 172.21.0.0/24
